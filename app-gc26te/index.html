<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>随机颜色生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#111;transition:background .45s ease;padding:20px}
.card{background:#ffffffee;border-radius:24px;padding:44px 40px;text-align:center;box-shadow:0 20px 60px #00000066;max-width:420px;width:100%}
h1{font-size:24px;color:#222;margin-bottom:6px}
.sub{font-size:13px;color:#888;margin-bottom:28px}
.preview{width:150px;height:150px;border-radius:50%;margin:0 auto 26px;box-shadow:0 8px 30px #00000033;transition:background .3s;border:4px solid #fff;outline:2px solid #00000011}
.hex{font-size:40px;font-weight:800;letter-spacing:3px;color:#222;font-family:ui-monospace,Menlo,Consolas,monospace;margin-bottom:8px;cursor:pointer;user-select:all}
.hint{font-size:12px;color:#aaa;margin-bottom:24px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:14px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:1px}
.btn-main{background:#222;color:#fff;flex:1;min-width:150px}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 8px 20px #00000044}
.btn-main:active{transform:scale(.97)}
.btn-copy{background:#f0f0f0;color:#444}
.btn-copy:hover{background:#e2e2e2}
.meta{margin-top:24px;display:flex;justify-content:space-around;font-size:13px;color:#666}
.meta b{display:block;font-size:16px;color:#222;margin-top:4px;font-family:ui-monospace,monospace}
.toast{position:fixed;top:30px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;display:none;z-index:99;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
.hist{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;cursor:pointer;transition:.15s;border:2px solid #fff;box-shadow:0 2px 6px #00000033}
.dot:hover{transform:scale(1.2)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="card">
 <h1>🎨 随机颜色生成器</h1>
 <div class="sub">按按钮或空格键，随机生成颜色</div>
 <div class="preview" id="preview"></div>
 <div class="hex" id="hex" title="点击复制">#3FA9F5</div>
 <div class="hint">点击色值可复制 · 按 空格键 也可以换色</div>
 <div class="row">
  <button class="btn btn-main" id="gen">🎲 生成颜色</button>
  <button class="btn btn-copy" id="copy">复制色值</button>
 </div>
 <div class="meta">
  <div>RGB<b id="rgb">63, 169, 245</b></div>
  <div>HSL<b id="hsl">204°, 90%, 60%</b></div>
  <div>名称<b id="cname">—</b></div>
 </div>
 <div class="hist" id="hist"></div>
</div>

<script>
const NAMED=[
 [255,0,0,'红色'],[0,255,0,'绿色'],[0,0,255,'蓝色'],[255,255,0,'黄色'],
 [255,0,255,'品红'],[0,255,255,'青色'],[255,165,0,'橙色'],[128,0,128,'紫色'],
 [0,128,0,'深绿'],[255,192,203,'粉红'],[139,69,19,'棕色'],[128,128,128,'灰色']
];
let cur='#3FA9F5', hist=[];
function rand255(){return Math.floor(Math.random()*256)}
function toHex(r,g,b){return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function rgb2hsl(r,g,b){
 r/=255;g/=255;b/=255;
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
 let h=0,s=0,l=(mx+mn)/2;
 if(mx!==mn){
  const d=mx-mn;
  s=l>0.5?d/(2-mx-mn):d/(mx+mn);
  if(mx===r)h=(g-b)/d+(g<b?6:0);
  else if(mx===g)h=(b-r)/d+2;
  else h=(r-g)/d+4;
  h*=60;
 }
 return[Math.round(h),Math.round(s*100),Math.round(l*100)];
}
function matchName(r,g,b){
 let best='—',bd=1e9;
 NAMED.forEach(([nr,ng,nb,n])=>{
  const d=(r-nr)**2+(g-ng)**2+(b-nb)**2;
  if(d<bd){bd=d;best=n}
 });
 return bd<6000?best:'—';
}
function apply(hex){
 const [r,g,b]=hex2rgb(hex);
 cur=hex;
 document.body.style.background=hex;
 document.getElementById('preview').style.background=hex;
 document.getElementById('hex').textContent=hex;
 document.getElementById('rgb').textContent=r+', '+g+', '+b;
 const [h,s,l]=rgb2hsl(r,g,b);
 document.getElementById('hsl').textContent=h+'°, '+s+'%, '+l+'%';
 document.getElementById('cname').textContent=matchName(r,g,b);
}
function generate(){
 const hex=toHex(rand255(),rand255(),rand255());
 apply(hex);
 hist.unshift(hex);
 if(hist.length>8)hist.pop();
 renderHist();
}
function renderHist(){
 document.getElementById('hist').innerHTML=hist.map((h,i)=>
  '<div class="dot" style="background:'+h+';opacity:'+(1-i*0.1)+'" onclick="apply(\''+h+'\')" title="'+h+'"></div>').join('');
}
function copyHex(){
 const t=cur;
 const done=()=>showToast('已复制 '+t);
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(t).then(done);
 }else{
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
  ta.select();document.execCommand('copy');document.body.removeChild(ta);
  done();
 }
}
function showToast(m){
 const t=document.getElementById('toast');t.textContent=m;t.style.display='block';
 clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1500);
}
document.getElementById('gen').onclick=generate;
document.getElementById('copy').onclick=copyHex;
document.getElementById('hex').onclick=copyHex;
document.addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();generate()}
 if(e.code==='KeyC'&&!e.ctrlKey&&!e.metaKey)copyHex();
});
generate();
</script>
</body>
</html>

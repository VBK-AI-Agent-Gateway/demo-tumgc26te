<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>酷影视频 - 首页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f0f10;color:#f1f1f1;min-height:100vh;padding-bottom:60px}
.topbar{background:#181818;border-bottom:1px solid #2a2a2a;position:sticky;top:0;z-index:100}
.tb-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:0 16px;height:56px}
.logo{font-size:22px;font-weight:800;color:#00a0e9;cursor:pointer;letter-spacing:1px;flex-shrink:0}
.logo span{color:#ff6a00}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{color:#a0a0a0;text-decoration:none;padding:7px 13px;border-radius:16px;font-size:14px;white-space:nowrap;cursor:pointer;transition:.15s}
.nav a:hover{color:#fff;background:#2a2a2a}
.nav a.active{background:#00a0e9;color:#fff;font-weight:600}
.search{display:flex;background:#2a2a2a;border-radius:18px;overflow:hidden;flex-shrink:0;width:240px}
.search input{flex:1;background:transparent;border:none;outline:none;color:#fff;padding:8px 14px;font-size:13px}
.search button{background:#00a0e9;color:#fff;border:none;padding:0 16px;cursor:pointer;font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#00a0e9,#ff6a00);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex-shrink:0}
.container{max-width:1180px;margin:0 auto;padding:20px 16px}
.view{display:none}
.view.active{display:block}
.banner{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:26px}
.big-card{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;min-height:300px;background:linear-gradient(135deg,#003366,#00a0e9)}
.side-cards{display:flex;flex-direction:column;gap:12px}
.mini-card{flex:1;position:relative;border-radius:12px;overflow:hidden;cursor:pointer;min-height:94px}
.mini-card:nth-child(1){background:linear-gradient(135deg,#3d0066,#b400ff)}
.mini-card:nth-child(2){background:linear-gradient(135deg,#661400,#ff4d00)}
.mini-card:nth-child(3){background:linear-gradient(135deg,#004d33,#00d68a)}
.card-txt{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;background:linear-gradient(transparent,#000000cc)}
.card-txt .t{font-size:24px;font-weight:800;margin-bottom:6px}
.card-txt .d{font-size:13px;color:#ccc}
.mini-card .card-txt{padding:12px 14px}
.mini-card .card-txt .t{font-size:15px}
.mini-card .card-txt .d{font-size:11px;color:#aaa}
.play-badge{position:absolute;top:14px;left:14px;background:#ff6a00;color:#fff;font-size:11px;padding:3px 10px;border-radius:10px;font-weight:700}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px}
.sec-title{font-size:19px;font-weight:700;position:relative;padding-left:12px}
.sec-title::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:4px;background:#00a0e9;border-radius:2px}
.more{color:#a0a0a0;font-size:13px;cursor:pointer}
.more:hover{color:#00a0e9}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.vcard{cursor:pointer;transition:.2s}
.vcard:hover{transform:translateY(-3px)}
.thumb{position:relative;border-radius:8px;overflow:hidden;height:120px;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:8px}
.dur{position:absolute;right:6px;bottom:6px;background:#000000cc;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.views{position:absolute;left:6px;bottom:6px;background:#000000aa;color:#eee;font-size:11px;padding:2px 6px;border-radius:4px}
.badge{position:absolute;top:6px;left:6px;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700;color:#fff}
.badge.hot{background:#ff4d00}
.badge.vip{background:#ffd700;color:#000}
.badge.new{background:#00c853}
.vtitle{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.vmeta{font-size:12px;color:#8a8a8a;display:flex;gap:10px}
.g1{background:linear-gradient(135deg,#1a237e,#4527a0)}
.g2{background:linear-gradient(135deg,#004d40,#00897b)}
.g3{background:linear-gradient(135deg,#4e1a2f,#c2185b)}
.g4{background:linear-gradient(135deg,#333300,#9e9d24)}
.g5{background:linear-gradient(135deg,#1a1a4e,#3f51b5)}
.g6{background:linear-gradient(135deg,#4a148c,#7c4dff)}
.g7{background:linear-gradient(135deg,#bf360c,#ff7043)}
.g8{background:linear-gradient(135deg,#006064,#26c6da)}
.rank-list{counter-reset:rk}
.rank-item{display:flex;align-items:center;gap:14px;padding:11px 14px;background:#181818;border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.rank-item:hover{background:#222}
.rank-no{font-size:20px;font-weight:800;width:26px;text-align:center;color:#555;font-style:italic}
.rank-item:nth-child(1) .rank-no,.rank-item:nth-child(2) .rank-no,.rank-item:nth-child(3) .rank-no{color:#ff6a00}
.rank-info{flex:1}
.rank-info .t{font-size:14px;margin-bottom:3px}
.rank-info .d{font-size:12px;color:#8a8a8a}
.rank-play{color:#00a0e9;font-size:13px}
.player-wrap{display:none}
.player-wrap.active{display:block}
.back{color:#00a0e9;cursor:pointer;font-size:14px;margin-bottom:14px;display:inline-block}
.player{background:#000;border-radius:12px;aspect-ratio:16/9;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:70px}
.player .ctrl{position:absolute;inset:0;background:#00000066;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;cursor:pointer}
.player:hover .ctrl{opacity:1}
.play-btn{width:70px;height:70px;border-radius:50%;background:#00a0e9dd;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
.pinfo{padding:18px 0}
.pinfo h1{font-size:20px;margin-bottom:10px}
.pmeta{display:flex;gap:16px;color:#8a8a8a;font-size:13px;margin-bottom:14px;flex-wrap:wrap}
.actions{display:flex;gap:12px;margin-bottom:20px}
.act{padding:9px 22px;background:#2a2a2a;border-radius:20px;cursor:pointer;font-size:14px;transition:.15s}
.act:hover{background:#3a3a3a}
.act.liked{background:#00a0e9;color:#fff}
.ep-list{display:flex;gap:10px;flex-wrap:wrap}
.ep{padding:9px 18px;background:#181818;border:1px solid #2a2a2a;border-radius:8px;cursor:pointer;font-size:14px;transition:.15s}
.ep:hover{border-color:#00a0e9}
.ep.active{background:#00a0e9;border-color:#00a0e9;color:#fff;font-weight:700}
.cmts{margin-top:24px}
.cmt-input{display:flex;gap:10px;margin-bottom:16px}
.cmt-input input{flex:1;background:#181818;border:1px solid #2a2a2a;border-radius:8px;padding:11px 14px;color:#fff;outline:none;font-size:14px}
.cmt-input button{background:#00a0e9;color:#fff;border:none;border-radius:8px;padding:0 24px;cursor:pointer;font-size:14px}
.cmt{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #1f1f1f}
.cmt-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.cmt-b .n{font-size:13px;color:#00a0e9;margin-bottom:4px}
.cmt-b .c{font-size:14px;line-height:1.6}
.cmt-b .tm{font-size:11px;color:#666;margin-top:4px}
.empty{text-align:center;color:#666;padding:50px 0;font-size:14px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#181818;border-top:1px solid #2a2a2a;display:none;z-index:100}
.tab-bar .tb{flex:1;text-align:center;padding:9px 0 7px;font-size:10px;color:#8a8a8a;cursor:pointer}
.tab-bar .tb .i{font-size:20px;display:block;margin-bottom:2px}
.tab-bar .tb.on{color:#00a0e9}
@media(max-width:760px){
 .banner{grid-template-columns:1fr}
 .side-cards{flex-direction:row}
 .search{display:none}
 .nav a{font-size:13px;padding:6px 10px}
 .vgrid{grid-template-columns:repeat(2,1fr)}
 .tab-bar{display:flex}
 body{padding-bottom:70px}
 .card-txt .t{font-size:18px}
 .big-card{min-height:200px}
}
</style>
</head>

<script>
const LIB=[
 {t:'三体·第二季',c:'电视剧',tag:'热播',d:'45:00',v:'8.6亿',g:1,e:18,up:'更新至18集'},
 {t:'庆余年 第二季',c:'电视剧',tag:'独播',d:'46:12',v:'12.3亿',g:2,e:36,up:'全36集'},
 {t:'莲花楼',c:'电视剧',tag:'热播',d:'43:08',v:'6.1亿',g:3,e:40,up:'全40集'},

 {t:'凡人修仙传',c:'动漫',tag:'国漫',d:'22:10',v:'3.2亿',g:7,e:120,up:'更新至120集'},
 {t:'斗破苍穹 年番',c:'动漫',tag:'国漫',d:'21:45',v:'2.9亿',g:8,e:98,up:'更新至98集'},
 {t:'哪吒之魔童闹海',c:'电影',tag:'新片',d:'144:00',v:'9.1亿',g:5,e:1,up:'VIP免费'},

 {t:'沙丘2',c:'电影',tag:'新片',d:'166:00',v:'4.1亿',g:6,e:1,up:'VIP'},
 {t:'周处除三害',c:'电影',tag:'热映',d:'134:00',v:'3.8亿',g:7,e:1,up:'付费点播'},
 {t:'歌手2024',c:'综艺',tag:'直播',d:'128:00',v:'5.5亿',g:2,e:12,up:'更新至12期'},
 {t:'奔跑吧 第八季',c:'综艺',tag:'独播',d:'98:00',v:'3.4亿',g:3,e:10,up:'更新至10期'},
 {t:'向往的生活',c:'综艺',tag:'治愈',d:'90:00',v:'2.7亿',g:4,e:8,up:'更新至8期'},
 {t:'脱口秀和Ta的朋友们',c:'综艺',tag:'新综',d:'86:00',v:'1.9亿',g:6,e:6,up:'更新至6期'},

 {t:'默杀',c:'电影',tag:'新片',d:'120:00',v:'2.6亿',g:3,e:1,up:'付费点播'}
];
const RANKS=[
 {t:'三体·第二季',d:'482.6万热度 · 独播科幻巨制'},
 {t:'庆余年 第二季',d:'465.1万热度 · 王炸回归'},
 {t:'歌手2024',d:'402.8万热度 · 音综顶流'},
 {t:'莲花楼',d:'388.4万热度 · 武侠悬疑'},
 {t:'哪吒之魔童闹海',d:'376.2万热度 · 国漫之光'},
 {t:'繁花',d:'351.9万热度 · 王家卫美学'},
 {t:'奔跑吧 第八季',d:'322.5万热度'},
 {t:'长相思',d:'309.7万热度'}
];
const GRADS=['g1','g2','g3','g4','g5','g6','g7','g8'];
const EMOJI=['📺','🎬','🎭','🎪','🎸','🎥','👾','🐼','🚀','🌸','🔍','⚔️'];

function fmt(i){return GRADS[i%8]}
function emoji(i){return EMOJI[i%EMOJI.length]}
function toastMsg(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1600)}

function card(v,i){
 return `<div class="vcard" onclick="openVideo('${v.t}')">
  <div class="thumb ${fmt(i)}">
   <span>${emoji(i)}</span>
   <span class="badge ${v.tag==='VIP'?'vip':v.tag==='新片'||v.tag==='新剧'||v.tag==='新综'?'new':'hot'}">${v.tag}</span>
   <span class="views">▶ ${v.v}</span><span class="dur">${v.d}</span>
  </div>
  <div class="vtitle">${v.t}</div>
  <div class="vmeta"><span>${v.up}</span><span>${v.c}</span></div>
 </div>`;
}
function fill(id,arr){document.getElementById(id).innerHTML=arr.map((v,i)=>card(v,i)).join('')}
function fillOffset(id,arr,off){document.getElementById(id).innerHTML=arr.map((v,i)=>card(v,i+off)).join('')}

function renderHome(){
 fill('g-recommend',[LIB[0],LIB[1],LIB[8],LIB[14],LIB[5],LIB[10]]);
 fillOffset('g-tv',LIB.filter(x=>x.c==='电视剧'),2);
 fillOffset('g-movie',LIB.filter(x=>x.c==='电影'),4);
 fillOffset('g-variety',LIB.filter(x=>x.c==='综艺'),6);
 document.getElementById('ranks').innerHTML=RANKS.map((r,i)=>`
  <div class="rank-item" onclick="openVideo('${r.t}')">
   <div class="rank-no">${i+1}</div>
   <div class="rank-info"><div class="t">${r.t}</div><div class="d">${r.d}</div></div>
   <div class="rank-play">播放 ›</div>
  </div>`).join('');
}

document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{
 document.querySelectorAll('#nav a').forEach(x=>x.classList.remove('active'));
 a.classList.add('active');
 const c=a.dataset.c;
 if(c==='首页')go('home');
 else showList(c);
});

function showList(cat){
 go('list');
 document.getElementById('listTitle').textContent=cat;
 const arr=LIB.filter(x=>x.c===cat);
 document.getElementById('g-list').innerHTML=arr.length?arr.map((v,i)=>card(v,i)).join(''):'<div class="empty">该频道暂无内容</div>';
}

function doSearch(){
 const k=document.getElementById('kw').value.trim();
 go('list');
 document.getElementById('listTitle').textContent=k?`搜索：${k}`:'热门推荐';
 const arr=k?LIB.filter(x=>x.t.includes(k)||x.c.includes(k)):LIB;
 document.getElementById('g-list').innerHTML=arr.length?arr.map((v,i)=>card(v,i)).join(''):`<div class="empty">未找到「${k}」相关视频</div>`;
}

function go(v){
 document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='v-'+v));
 window.scrollTo(0,0);
 document.querySelectorAll('.tab-bar .tb').forEach((t,i)=>t.classList.toggle('on',(v==='home')&&i===0));
}

let curV=null,playing=false,liked={};
function openVideo(title){
 curV=LIB.find(x=>x.t===title)||{t:title,c:'电视剧',tag:'热播',d:'45:00',v:'3.2亿',g:1,e:12,up:'全12集'};
 curEp=1;playing=false;
 document.getElementById('pTitle').textContent='《'+curV.t+'》';
 document.getElementById('pIcon').textContent=emoji(LIB.indexOf(curV));
 document.getElementById('playerBox').className='player '+fmt(LIB.indexOf(curV));
 document.getElementById('pMeta').innerHTML=
  `<span>▶ ${curV.v}播放</span><span>${curV.c}</span><span>${curV.d}</span><span>${curV.up}</span><span style="color:#00a0e9">${curV.tag}</span>`;
 document.getElementById('playBtn').textContent='▶';
 document.getElementById('pLine').textContent='点击播放';
 const eps=document.getElementById('eps');
 const n=Math.min(curV.e,30);
 if(curV.c==='电影'||n===1){
  eps.innerHTML='<div class="ep active">正片</div>';
 }else{
  eps.innerHTML=Array.from({length:n},(_,i)=>`<div class="ep ${i===0?'active':''}" onclick="pickEp(this,${i+1})">${i+1}</div>`).join('');
 }
 document.getElementById('likeN').textContent=liked[curV.t]?'1.2万+1':'1.2万';
 document.getElementById('likeBtn').classList.toggle('liked',!!liked[curV.t]);
 renderCmts();
 go('player');
}
let curEp=1;
function pickEp(el,n){
 curEp=n;
 document.querySelectorAll('.ep').forEach(x=>x.classList.remove('active'));
 el.classList.add('active');
 playing=false;
 document.getElementById('playBtn').textContent='▶';
 document.getElementById('pLine').textContent='第 '+n+' 集 · 点击播放';
}
function togglePlay(){
 playing=!playing;
 document.getElementById('playBtn').textContent=playing?'⏸':'▶';
 document.getElementById('pLine').textContent=(playing?'正在播放 · 第 '+curEp+' 集':'已暂停 · 第 '+curEp+' 集');
 if(playing)toastMsg('已开启倍速 1.0x');
}
function doLike(){
 if(!curV)return;
 liked[curV.t]=!liked[curV.t];
 document.getElementById('likeBtn').classList.toggle('liked',liked[curV.t]);
 document.getElementById('likeN').textContent=liked[curV.t]?'1.2万+1':'1.2万';
 toastMsg(liked[curV.t]?'点赞成功':'已取消点赞');
}
let CMPS=[
 {n:'追剧人小王',c:'三体特效封神了！这季直接拉满，Netflix 级质感！',t:'2小时前',i:0},
 {n:'科幻迷老张',c:'原著党满意，黑暗森林法则拍出来了。',t:'3小时前',i:5},
 {n:'路过的观众',c:'一口气看了六集根本停不下来…',t:'5小时前',i:7}
];
function renderCmts(){
 document.getElementById('cmtN').textContent='('+CMPS.length+')';
 document.getElementById('cmts').innerHTML=CMPS.map(c=>`
  <div class="cmt">
   <div class="cmt-av ${fmt(c.i)}">${c.n[0]}</div>
   <div class="cmt-b"><div class="n">${c.n}</div><div class="c">${c.c}</div><div class="tm">${c.t}</div></div>
  </div>`).join('');
}
function sendCmt(){
 const b=document.getElementById('cmtBox');
 const v=b.value.trim();
 if(!v){toastMsg('请输入内容');return}
 CMPS.unshift({n:'我',c:v,t:'刚刚',i:2});
 b.value='';renderCmts();toastMsg('评论发布成功');
}

renderHome();
</script>

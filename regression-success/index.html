<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 到 3 · 逐行列出</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0f1115; color:#e8eaed;
         font-family: system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .card { background:#171a21; border:1px solid #262b36; border-radius:16px;
          padding:36px 56px; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  h1 { font-size:16px; font-weight:600; color:#9aa3b2; margin:0 0 20px; }
  ol { font-size:40px; font-weight:700; line-height:1.6; margin:0; padding-left:56px;
       color:#4ade80; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <div class="card">
    <h1>数字 1 到 3（逐行）</h1>
    <ol><li>1</li><li>2</li><li>3</li></ol>
  </div>
</body>
</html>

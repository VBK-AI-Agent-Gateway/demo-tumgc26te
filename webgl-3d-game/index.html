<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际穿越 · 3D 跑酷</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060f;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#eaf2ff;}
  #c{display:block;width:100%;height:100%;}
  .hud{position:fixed;top:0;left:0;width:100%;padding:16px 22px;
    display:flex;justify-content:space-between;pointer-events:none;
    text-shadow:0 2px 10px rgba(0,0,0,.8);font-variant-numeric:tabular-nums;}
  .hud .l{font-size:15px;letter-spacing:1px;opacity:.9;}
  .hud .r{text-align:right;}
  .hud .score{font-size:30px;font-weight:800;
    background:linear-gradient(90deg,#4ef0ff,#a97bff);-webkit-background-clip:text;
    background-clip:text;color:transparent;}
  .hud .sub{font-size:12px;opacity:.6;letter-spacing:2px;}
  .bar{position:fixed;left:22px;bottom:20px;width:220px;pointer-events:none;}
  .bar .lbl{font-size:11px;letter-spacing:2px;opacity:.65;margin-bottom:6px;}
  .bar .track{height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;}
  .bar .fill{height:100%;width:100%;border-radius:6px;
    background:linear-gradient(90deg,#4ef0ff,#66ffb2);transition:width .12s linear;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(circle at 50% 40%,rgba(40,60,140,.55),rgba(5,6,15,.96));
    backdrop-filter:blur(3px);transition:opacity .35s;z-index:10;}
  #overlay.hide{opacity:0;pointer-events:none;}
  #overlay h1{font-size:52px;font-weight:900;letter-spacing:4px;
    background:linear-gradient(90deg,#4ef0ff,#a97bff,#ff7bd5);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;}
  #overlay .tag{font-size:14px;opacity:.75;letter-spacing:6px;margin-bottom:30px;}
  #overlay .keys{font-size:13px;opacity:.8;line-height:2;margin-bottom:30px;}
  #overlay kbd{display:inline-block;min-width:26px;padding:3px 9px;margin:0 3px;
    border-radius:6px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08);font-family:inherit;font-size:12px;}
  #overlay button{padding:14px 54px;font-size:17px;font-weight:800;letter-spacing:3px;
    border:none;border-radius:999px;cursor:pointer;color:#04121c;
    background:linear-gradient(90deg,#5df3ff,#9d7cff);
    box-shadow:0 10px 34px rgba(93,243,255,.35);transition:transform .15s,box-shadow .15s;}
  #overlay button:hover{transform:translateY(-2px) scale(1.03);
    box-shadow:0 16px 42px rgba(157,124,255,.5);}
  #overlay .best{margin-top:18px;font-size:13px;opacity:.7;letter-spacing:1px;}
  #overlay .final{margin-bottom:26px;font-size:19px;opacity:.95;}
  #overlay .final b{font-size:38px;display:block;margin-top:8px;
    background:linear-gradient(90deg,#4ef0ff,#ff7bd5);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  #flash{position:fixed;inset:0;background:rgba(255,60,90,.42);opacity:0;
    pointer-events:none;transition:opacity .25s;z-index:9;}
  @media(max-width:640px){
    #overlay h1{font-size:34px;} .hud .score{font-size:24px;} .bar{width:150px;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div class="hud">
  <div class="l">里程 <span id="dist">0</span> m<br><span class="sub">SPEED <span id="spd">1.0</span>x</span></div>
  <div class="r"><div class="score" id="score">0</div><div class="sub">SCORE</div></div>
</div>
<div class="bar">
  <div class="lbl">护盾 ENERGY</div>
  <div class="track"><div class="fill" id="energy"></div></div>
</div>

<div id="overlay">
  <h1 id="title">星际穿越</h1>
  <div class="tag" id="tag">3D · 无尽跑酷</div>
  <div class="keys" id="keys">
    <kbd>A</kbd><kbd>D</kbd> 左右移动 &nbsp;·&nbsp; <kbd>W</kbd><kbd>S</kbd> 前后微调 &nbsp;·&nbsp; <kbd>空格</kbd> 冲刺<br>
    躲开红色陨石，吃蓝色能量块
  </div>
  <div class="final" id="final" style="display:none"></div>
  <button id="btn">开始游戏</button>
  <div class="best" id="best"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>

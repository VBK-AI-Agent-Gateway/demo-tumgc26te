<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标准OA协同办公系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 登录页 -->
  <div id="loginPage" class="login-page">
    <div class="login-box">
      <div class="login-logo">🏢</div>
      <h1>标准OA协同办公系统</h1>
      <p class="sub">Standard Office Automation System</p>
      <div class="form-item">
        <label>账号</label>
        <input id="loginUser" type="text" placeholder="如 admin / zhangsan / lisi" value="admin">
      </div>
      <div class="form-item">
        <label>密码</label>
        <input id="loginPass" type="password" placeholder="任意密码即可" value="123456">
      </div>
      <button class="btn-primary btn-block" onclick="doLogin()">登 录</button>
      <p class="login-tip">演示账号: admin(管理员) / zhangsan(经理) / lisi(员工)</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="mainPage" class="main hidden">
    <header class="topbar">
      <div class="brand">🏢 标准OA协同办公系统</div>
      <div class="topbar-right">
        <span class="clock" id="clock"></span>
        <span class="user-chip" id="userChip"></span>
        <button class="btn-plain" onclick="logout()">退出</button>
      </div>
    </header>
    <div class="layout">
      <aside class="sider">
        <nav id="menu"></nav>
      </aside>
      <main class="content">
        <div id="view"></div>
      </main>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>经典坦克大战</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#15181d;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#e8e8e8;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
h1{color:#ffd76e;font-size:20px;letter-spacing:3px;margin-bottom:8px}
.bar{display:flex;gap:16px;align-items:center;margin-bottom:10px;font-size:14px;flex-wrap:wrap;justify-content:center}
.bar b{color:#ffd76e}
canvas{background:#000;border:3px solid #555;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:100%}
.tip{margin-top:10px;font-size:13px;color:#9aa7bd;text-align:center;line-height:1.7}
.btn{padding:8px 18px;border:0;border-radius:6px;background:#2f7d4f;color:#fff;font-size:14px;cursor:pointer}
.btn:hover{background:#256640}
.mask{position:fixed;inset:0;background:rgba(8,10,14,.82);display:flex;align-items:center;justify-content:center;z-index:9}
.mask.off{display:none}
.m{background:#1b2028;border:2px solid #3a4453;border-radius:12px;padding:30px 46px;text-align:center;max-width:92vw}
.m h2{color:#ffd76e;font-size:26px;margin-bottom:12px}
.m p{font-size:15px;line-height:2;color:#b8c6dd}
.m .btn{margin-top:16px;font-size:16px;padding:10px 30px}
</style>
</head>
<body>
<h1>💣 经典坦克大战</h1>
<div class="bar">
  <span>关卡 <b id="lv">1</b></span>
  <span>得分 <b id="sc">0</b></span>
  <span>生命 <b id="hp">❤❤❤</b></span>
  <span>敌军剩余 <b id="em">0</b></span>
  <button class="btn" onclick="restart()">重新开始</button>
  <button class="btn" style="background:#3a7bd5" onclick="togglePause()">暂停/继续</button>
</div>
<canvas id="cv" width="720" height="720"></canvas>
<div class="tip">方向键/WASD 移动 · 空格/J 开火 · 保卫基地（金鹰），消灭所有敌军坦克！<br>可击穿的砖墙、不可摧毁的钢墙、每关递增的敌军数量</div>

<div class="mask" id="ov">
  <div class="m">
    <h2 id="ovT">经典坦克大战</h2>
    <p id="ovP">保卫你的基地，消灭一波又一波敌军坦克！</p>
    <button class="btn" id="ovB" onclick="startGame()">开始游戏</button>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const TS=40,COLS=18,ROWS=18,W=COLS*TS,H=ROWS*TS;
let grid,player,enemies,bullets,base,level,score,hp,paused,over,spawnTimer,shootCD,enemyShotCD,eSpawnCount;

function hud(){lv.textContent=level;sc.textContent=score;hpEl.textContent='❤'.repeat(Math.max(0,hp));em.textContent=enemies.length;}
const lv=document.getElementById('lv'),sc=document.getElementById('sc'),hpEl=document.getElementById('hp'),em=document.getElementById('em');

function idx(c,r){return r*COLS+c}
function cell(c,r){if(c<0||r<0||c>=COLS||r>=ROWS)return null;return grid[idx(c,r)]}

function buildMap(lv_){
  grid=new Array(COLS*ROWS).fill(0); // 0空 1砖 2钢
  // 边界外不画, 内部随机砖墙
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c===0||r===0||c===COLS-1||r===ROWS-1){grid[idx(c,r)]=0;continue}
    if(c<2&&r>ROWS-5)continue;
    if(Math.random()<0.30+lv_*0.015)grid[idx(c,r)]=1;
    else if(Math.random()<0.045)grid[idx(c,r)]=2;
  }
  // 通道清理(保证可走)
  for(let r=1;r<ROWS-1;r+=2)for(let c=1;c<COLS-1;c++){
    if(Math.random()<0.5){grid[idx(c,r)]=0;if(c+1<COLS-1)grid[idx(c+1,r)]=0}
  }
  // 出生点空地
  const clear=(c0,r0,w,h)=>{for(let r=r0;r<r0+h;r++)for(let c=c0;c<c0+w;c++)if(c>0&&r>0&&c<COLS-1&&r<ROWS-1)grid[idx(c,r)]=0};
  clear(8,15,3,3);clear(7,0,4,3);
  base={c:8,r:16,x:8*TS+8,y:16*TS+8,w:TS-16,h:TS-16,alive:true};
  // 基地周围砖墙
  [[7,15],[8,15],[9,15],[7,16],[9,16]].forEach(([c,r])=>grid[idx(c,r)]=1);
}

function newPlayer(){
  player={x:8*TS+6,y:16*TS+6,w:TS-12,h:TS-12,dir:'up',speed:2.6,cd:0};
}
function spawnEnemy(){
  const spots=[0,8,COLS-1];
  const c=spots[Math.floor(Math.random()*3)];
  const types=['basic','fast','power','armor'];
  const t=types[Math.floor(Math.random()*Math.min(4,1+Math.floor(level/2)))];
  enemies.push({x:c*TS+6,y:6,w:TS-12,h:TS-12,dir:'down',t:t,
    speed:t==='fast'?2.4:1.4,cd:Math.random()*60,alive:true,
    hp:t==='armor'?3:1,flash:0});
}

function tryMove(o,nx,ny){
  nx=Math.max(TS,Math.min(W-TS-o.w,nx));
  ny=Math.max(TS,Math.min(H-TS-o.h,ny));
  const c0=Math.floor(nx/TS),c1=Math.floor((nx+o.w-1)/TS);
  const r0=Math.floor(ny/TS),r1=Math.floor((ny+o.h-1)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const t=cell(c,r);
    if(t===1||t===2)return false;
  }
  // 坦克互撞(敌)
  if(o!==player&&enemies){
    if(rectHit({x:nx,y:ny,w:o.w,h:o.h},player))return false;
    for(const e of enemies){if(e!==o&&e.alive&&rectHit({x:nx,y:ny,w:o.w,h:o.h},e))return false}
  }
  // 基地碰撞
  if(base&&base.alive&&rectHit({x:nx,y:ny,w:o.w,h:o.h},{x:base.x-6,y:base.y-6,w:base.w+12,h:base.h+12}))return false;
  o.x=nx;o.y=ny;return true;
}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function fire(owner){
  const t=owner;
  const b={x:t.x+t.w/2-3,y:t.y+t.h/2-3,w:6,h:6,owner:owner===player?'p':'e',dir:t.dir,alive:true};
  const sp=owner===player?6.5:4;
  if(t.dir==='up')b.vy=-sp,b.vx=0;
  if(t.dir==='down')b.vy=sp,b.vx=0;
  if(t.dir==='left')b.vx=-sp,b.vy=0;
  if(t.dir==='right')b.vx=sp,b.vy=0;
  bullets.push(b);
}

function hurtPlayer(){
  hp--;hud();
  for(let i=0;i<16;i++)parts.push({x:player.x+18,y:player.y+18,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,t:24});
  if(hp<=0){gameOver(false);return}
  newPlayer();
}
function destroyBase(){
  base.alive=false;gameOver(false);
}

function update(){
  if(paused||over)return;
  // 玩家
  const s=player.speed;let moving=false;
  if(keys['ArrowLeft']||keys['KeyA']){player.dir='left';tryMove(player,player.x-s,player.y);moving=true}
  else if(keys['ArrowRight']||keys['KeyD']){player.dir='right';tryMove(player,player.x+s,player.y);moving=true}
  else if(keys['ArrowUp']||keys['KeyW']){player.dir='up';tryMove(player,player.x,player.y-s);moving=true}
  else if(keys['ArrowDown']||keys['KeyS']){player.dir='down';tryMove(player,player.x,player.y+s);moving=true}
  if(player.cd>0)player.cd--;
  if((keys['Space']||keys['KeyJ'])&&player.cd<=0){fire(player);player.cd=14}

  // 敌人
  spawnTimer--;
  if(spawnTimer<=0&&enemies.length<5&&eSpawnCount<8+level*2){spawnEnemy();eSpawnCount++;spawnTimer=80-level*5}
  for(const e of enemies){
    if(!e.alive)continue;
    e.cd--;
    // 随机转向
    if(Math.random()<0.03||e.stuck>0){
      const dirs=['up','down','left','right'];
      e.dir=dirs[Math.floor(Math.random()*4)];
      e.stuck=0;
    }
    const px=e.x,py=e.y;
    if(e.dir==='up')tryMove(e,e.x,e.y-e.speed);
    if(e.dir==='down')tryMove(e,e.x,e.y+e.speed);
    if(e.dir==='left')tryMove(e,e.x-e.speed,e.y);
    if(e.dir==='right')tryMove(e,e.x+e.speed,e.y);
    if(e.x===px&&e.y===py)e.stuck=(e.stuck||0)+1;
    else{
      // 朝基地倾向
      if(Math.random()<0.35){
        if(base.alive){e.dir=(base.x<e.x)?'left':'right';
          if(Math.random()<0.5)e.dir=(base.y<e.y)?'up':'down'}
      }
    }
    if(e.cd<=0){fire(e);e.cd=70+Math.random()*60}
    if(e.flash>0)e.flash--;
    // 与玩家相撞
    if(rectHit(e,player)){hurtPlayer();e.alive=false}
  }
  enemies=enemies.filter(e=>e.alive||e.flash>0);

  // 子弹
  for(const b of bullets){
    if(!b.alive)continue;
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<4||b.y<4||b.x>W-4||b.y>H-4){
      b.alive=false;
      if(b.owner==='e'&&base.alive&&rectHit(b,base))destroyBase();
      continue;
    }
    // 撞墙
    const c=Math.floor((b.x+3)/TS),r=Math.floor((b.y+3)/TS);
    const t=cell(c,r);
    if(t===1){grid[idx(c,r)]=0;b.alive=false;continue}
    if(t===2){
      b.alive=false;
      continue;
    }
    // 子弹互消
    if(b.owner==='p'){
      for(const ob of bullets){if(ob!==b&&ob.alive&&ob.owner==='e'&&rectHit(b,ob)){b.alive=false;ob.alive=false}}
    }
    // 命中敌
    if(b.owner==='p'){
      for(const e of enemies){
        if(e.alive&&rectHit(b,e)){
          b.alive=false;e.hp--;e.flash=6;
          if(e.hp<=0){e.alive=false;score+=(e.t==='armor'?50:e.t==='power'?30:e.t==='fast'?20:10);hud();
            for(let i=0;i<14;i++)parts.push({x:e.x+18,y:e.y+18,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,t:26});}
          break;
        }
      }
    }else{
      if(rectHit(b,player)){b.alive=false;hurtPlayer()}
    }
    // 命中基地
    if(base.alive&&rectHit(b,base)){b.alive=false;destroyBase()}
  }
  bullets=bullets.filter(b=>b.alive);
  enemies=enemies.filter(e=>e.alive);
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.t--;return p.t>0});

  // 过关
  if(enemies.length===0&&eSpawnCount>=8+level*2){nextLevel()}
}

function nextLevel(){
  score+=100;level++;hud();
  buildMap(level);newPlayer();bullets=[];enemies=[];parts=[];
  spawnTimer=60;eSpawnCount=0;
}
function gameOver(win){
  over=true;
  ov.classList.remove('off');
  ovT.textContent=win?'🏆 胜利！':'💀 游戏结束';
  ovP.textContent='得分：'+score+' · 到达关卡：'+level;
  ovB.textContent='再玩一次';
}
function startGame(){
  level=1;score=0;hp=3;paused=false;over=false;
  buildMap(1);newPlayer();enemies=[];bullets=[];parts=[];
  spawnTimer=50;eSpawnCount=0;hud();
  ov.classList.add('off');
}
function restart(){startGame()}
function togglePause(){if(!over)paused=!paused}
const ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');

let keys={};
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true});
addEventListener('keyup',e=>keys[e.code]=false);

let parts=[];

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  // 网格地
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=grid[idx(c,r)];
    if(t===1){
      ctx.fillStyle='#9c5a33';ctx.fillRect(c*TS,r*TS,TS,TS);
      ctx.strokeStyle='#6e3c1e';ctx.lineWidth=2;
      ctx.strokeRect(c*TS+2,r*TS+2,TS/2-3,TS/2-3);
      ctx.strokeRect(c*TS+TS/2+1,r*TS+2,TS/2-3,TS/2-3);
      ctx.strokeRect(c*TS+2,r*TS+TS/2+1,TS/2-3,TS/2-3);
      ctx.strokeRect(c*TS+TS/2+1,r*TS+TS/2+1,TS/2-3,TS/2-3);
    }else if(t===2){
      ctx.fillStyle='#b9c2d0';ctx.fillRect(c*TS,r*TS,TS,TS);
      ctx.fillStyle='#7d879a';
      ctx.fillRect(c*TS+4,r*TS+4,10,10);ctx.fillRect(c*TS+26,r*TS+4,10,10);
      ctx.fillRect(c*TS+4,r*TS+26,10,10);ctx.fillRect(c*TS+26,r*TS+26,10,10);
    }
  }
  // 基地
  if(base.alive){
    ctx.fillStyle='#ffd76e';
    ctx.fillRect(base.x-4,base.y-4,base.w+8,base.h+8);
    ctx.fillStyle='#15181d';
    ctx.beginPath();ctx.arc(base.x+base.w/2,base.y+base.h/2,13,0,7);ctx.fill();
    ctx.fillStyle='#ffd76e';ctx.font='16px serif';ctx.textAlign='center';
    ctx.fillText('🦅',base.x+base.w/2,base.y+base.h/2+6);
  }else{
    ctx.fillStyle='#444';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText('基地被毁',base.x+12,base.y+16);
  }

  // 坦克绘制
  function tank(t,color,enemy){
    ctx.save();ctx.translate(t.x+t.w/2,t.y+t.h/2);
    const rot={up:0,right:Math.PI/2,down:Math.PI,left:-Math.PI}[t.dir||'up'];
    ctx.rotate(rot);
    // 履带
    ctx.fillStyle=enemy?'#333':'#222';
    ctx.fillRect(-t.w/2,-t.h/2,8,t.h);ctx.fillRect(t.w/2-8,-t.h/2,8,t.h);
    // 车身
    ctx.fillStyle=color;ctx.fillRect(-t.w/2+7,-t.h/2+2,t.w-14,t.h-4);
    // 炮塔
    ctx.fillStyle=enemy?'#222':'#1e331e';
    ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();
    // 炮管
    ctx.fillStyle='#111';ctx.fillRect(-2,-t.h/2-10,4,14);
    ctx.restore();
  }
  enemies.forEach(e=>{
    const col=e.t==='armor'?(e.hp>1?'#4f7a3f':'#7a6a3f'):e.t==='fast'?'#b98a2f':e.t==='power'?'#a33a3a':'#777';
    tank(e,col,true);
  });
  if(!over)tank(player,'#4f7a3f',false);

  // 子弹
  bullets.forEach(b=>{ctx.fillStyle=b.owner==='p'?'#fff':'#ff9d5c';ctx.fillRect(b.x-3,b.y-3,6,6)});

  // 粒子
  parts.forEach(p=>{ctx.globalAlpha=p.t/26;ctx.fillStyle='#ff7043';ctx.fillRect(p.x,p.y,5,5);ctx.globalAlpha=1});
}

function loop(){update();draw();requestAnimationFrame(loop)}
startGame();
loop();
</script>
</body>
</html>

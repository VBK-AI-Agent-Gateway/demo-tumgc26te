<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>1942空战</title>
<style>
html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;touch-action:none;font-family:"Microsoft YaHei",sans-serif}
#c{display:block;margin:0 auto;background:#000}
#hud{position:fixed;top:6px;left:50%;transform:translateX(-50%);width:520px;max-width:96vw;color:#fff;display:flex;justify-content:space-between;font-size:15px;text-shadow:0 0 4px #000;z-index:5;pointer-events:none}
#ovl{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10;background:rgba(5,8,20,.82)}
#ovl h1{font-size:44px;margin:0 0 10px;color:#ffd24a;text-shadow:0 0 18px #ff9800}
#ovl p{margin:6px 0;color:#cfe0ff;font-size:16px}
#btn{margin-top:18px;padding:12px 44px;font-size:20px;border:0;border-radius:6px;background:#ff9800;color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(255,152,0,.5)}
#btn:active{transform:scale(.96)}
</style>
</head>
<body>
<div id="hud"><span id="sS">得分 0</span><span id="sL">❤❤❤</span><span id="sB">关卡 1</span></div>
<canvas id="c"></canvas>
<div id="ovl"><h1>1942 空战</h1><p>拖动 / 方向键 移动战机 · 自动射击</p><p>吃 🔺 双倍火力 · 消灭敌机得分</p><button id="btn">开始游戏</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=520,H=720;
function fit(){const s=Math.min(innerWidth/520,innerHeight/720);W=cv.width=Math.floor(520*s);H=cv.height=Math.floor(720*s);cv.style.width=W+'px';cv.style.height=H+'px'}
addEventListener('resize',fit);fit();
const ovl=document.getElementById('ovl'),btn=document.getElementById('btn');
const sS=document.getElementById('sS'),sL=document.getElementById('sL'),sB=document.getElementById('sB');
let state='menu',score=0,lives=3,level=1,stars=[],player,bullets,ebullets,enemies,powers,parts,t=0,spawnT,shake=0,dying=0;
for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.4,v:Math.random()*40+30});
function reset(){score=0;lives=3;level=1;t=0;spawnT=60;shake=0;dying=0;
player={x:W/2,y:H-100,r:14,cool:0,inv:120,pw:0};
bullets=[];ebullets=[];enemies=[];powers=[];parts=[];}
function start(){reset();state='play';ovl.style.display='none';}
btn.onclick=start;
addEventListener('keydown',e=>{keys[e.key]=true;if(state==='menu'||state==='over')start();});
addEventListener('keyup',e=>keys[e.key]=false);
const keys={};
let drag=false;
function pos(e){const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*cv.width/r.width,y:(p.clientY-r.top)*cv.height/r.height}}
cv.addEventListener('pointerdown',e=>{if(state==='play'){drag=true;const p=pos(e);player.tx=p.x;player.ty=p.y;}});
cv.addEventListener('pointermove',e=>{if(drag&&state==='play'){const p=pos(e);player.tx=p.x;player.ty=p.y;}});
addEventListener('pointerup',()=>drag=false);
function boom(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*200+40;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:30+Math.random()*20,c});}}
function spawn(){const lane=40+Math.random()*(W-80);const ty=Math.random();
if(ty<.6){enemies.push({type:0,x:lane,y:-30,r:14,hp:1,vx:0,vy:90+level*8,f:Math.random()*6});}
else if(ty<.9){enemies.push({type:1,x:lane,y:-40,r:24,hp:4+level,vx:0,vy:55+level*5,f:Math.random()*6});}
else{enemies.push({type:2,x:lane,y:-40,r:18,hp:6,vx:(Math.random()<.5?-1:1)*(60+level*6),vy:70,f:Math.random()*6});}}
function collide(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<(a.r+b.r)*(a.r+b.r)}
function update(){
if(state!=='play')return;
t++;if(t%10===0){level=1+Math.floor(score/1500);}
spawnT--;if(spawnT<=0){spawn();if(level>3&&Math.random()<.4)spawn();spawnT=Math.max(25,70-level*4);}
if(player.inv>0)player.inv--;
if(!dying){
if(keys['ArrowLeft']||keys['a'])player.x-=340/60;if(keys['ArrowRight']||keys['d'])player.x+=340/60;
if(keys['ArrowUp']||keys['w'])player.y-=340/60;if(keys['ArrowDown']||keys['s'])player.y+=340/60;
if(player.tx!==undefined){player.x+=(player.tx-player.x)*.35;player.y+=(player.ty-player.y)*.35;}
player.x=Math.max(18,Math.min(W-18,player.x));player.y=Math.max(40,Math.min(H-30,player.y));
player.cool--;if(player.cool<=0){player.cool=player.pw>0?7:10;
if(player.pw>0){bullets.push({x:player.x-10,y:player.y-16,r:4,vy:-640});bullets.push({x:player.x+10,y:player.y-16,r:4,vy:-640});}
bullets.push({x:player.x,y:player.y-22,r:4,vy:-640});}
if(player.pw>0)player.pw--;}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y+=b.vy/60;if(b.y<-20)bullets.splice(i,1);}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.f+=.1;e.x+=e.vx/60;e.y+=e.vy/60;
if(e.x<20||e.x>W-20)e.vx*=-1;
if(e.y>H+50){enemies.splice(i,1);continue;}
if(e.type===1&&e.y>60&&Math.random()<.006+level*.001){ebullets.push({x:e.x,y:e.y+20,r:5,vy:230+level*10});}
if(!dying&&player.inv<=0&&collide(e,player)){enemies.splice(i,1);boom(player.x,player.y,26,'#7fd4ff');hitPlayer();continue;}
let dead=false;
for(let j=bullets.length-1;j>=0;j--){if(collide(e,bullets[j])){bullets.splice(j,1);e.hp--;e.hit=4;
if(e.hp<=0){dead=true;
score+=e.type===0?100:e.type===1?400:300;boom(e.x,e.y,e.type===1?40:22,e.type===1?'#ff9800':'#ffe082');
if(Math.random()<.09)powers.push({x:e.x,y:e.y,r:12,vy:110});break;}}}
if(dead)enemies.splice(i,1);}
for(let i=ebullets.length-1;i>=0;i--){const b=ebullets[i];b.y+=b.vy/60;
if(b.y>H+20){ebullets.splice(i,1);continue;}
if(!dying&&player.inv<=0&&collide(b,player)){ebullets.splice(i,1);boom(player.x,player.y,26,'#7fd4ff');hitPlayer();}}
for(let i=powers.length-1;i>=0;i--){const p=powers[i];p.y+=p.vy/60;p.x+=Math.sin(p.y*.05)*.6;
if(p.y>H+20){powers.splice(i,1);continue;}
if(collide(p,player)){powers.splice(i,1);player.pw=600;score+=50;}}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx/60;p.y+=p.vy/60;p.l--;if(p.l<=0)parts.splice(i,1);}
if(shake>0)shake*=.88;
sS.textContent='得分 '+score;sL.textContent='❤'.repeat(Math.max(0,lives))||'—';sB.textContent='关卡 '+level;}
function hitPlayer(){if(player.pw>0){player.pw=0;return;}
lives--;player.inv=150;dying=12;shake=14;setTimeout(()=>dying=0,200);
if(lives<=0){state='over';ovl.style.display='flex';
ovl.innerHTML='<h1>游戏结束</h1><p>最终得分：'+score+'</p><p>到达关卡：'+level+'</p><button id="btn2">再来一局</button>';
document.getElementById('btn2').onclick=start;}}
function drawShip(x,y){ctx.save();ctx.translate(x,y);
ctx.fillStyle='#7fd4ff';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(7,2);ctx.lineTo(20,12);ctx.lineTo(6,10);ctx.lineTo(4,18);ctx.lineTo(-4,18);ctx.lineTo(-6,10);ctx.lineTo(-20,12);ctx.lineTo(-7,2);ctx.closePath();ctx.fill();
ctx.fillStyle='#eaf7ff';ctx.fillRect(-2,-8,4,10);
ctx.fillStyle='#ffb300';const f=6+Math.random()*8;ctx.beginPath();ctx.moveTo(-3,19);ctx.lineTo(0,19+f);ctx.lineTo(3,19);ctx.fill();
ctx.restore();}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.vx>0? .2:-.2);
if(e.type===0){ctx.fillStyle=e.hit>0?'#fff':'#ff5252';ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(12,-8);ctx.lineTo(4,-4);ctx.lineTo(0,-14);ctx.lineTo(-4,-4);ctx.lineTo(-12,-8);ctx.closePath();ctx.fill();}
else if(e.type===1){ctx.fillStyle=e.hit>0?'#fff':'#ab47bc';ctx.fillRect(-22,-12,44,22);ctx.fillStyle='#ff8a65';ctx.fillRect(-8,-16,16,8);ctx.fillStyle='#ce93d8';ctx.fillRect(-26,-6,8,10);ctx.fillRect(18,-6,8,10);}
else{ctx.fillStyle=e.hit>0?'#fff':'#66bb6a';ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(16,0);ctx.lineTo(6,-6);ctx.lineTo(10,-16);ctx.lineTo(-10,-16);ctx.lineTo(-6,-6);ctx.lineTo(-16,0);ctx.closePath();ctx.fill();}
ctx.restore();if(e.hit>0)e.hit--;}
function draw(){ctx.save();
if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05060f');g.addColorStop(1,'#101c3a');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
for(const s of stars){ctx.fillStyle='rgba(255,255,255,'+(s.s/2)+')';ctx.fillRect(s.x,s.y,s.s,s.s*2);}
ctx.fillStyle='#ffd54f';for(const p of powers){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t*.1);ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(10,8);ctx.lineTo(-10,8);ctx.closePath();ctx.fill();ctx.restore();}
ctx.fillStyle='#ffe57f';for(const b of bullets)ctx.fillRect(b.x-2,b.y-8,4,10);
ctx.fillStyle='#ff8a80';for(const b of ebullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();}
for(const e of enemies)drawEnemy(e);
for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/45);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);ctx.globalAlpha=1;}
if(state==='play'&&!(dying>0))drawShip(player.x,player.y);
if(player&&player.inv>0&&state==='play'&&t%8<4){ctx.strokeStyle='rgba(127,212,255,.7)';ctx.beginPath();ctx.arc(player.x,player.y,24,0,7);ctx.stroke();}
ctx.restore();}
function loop(){if(state==='play')update();else{for(const s of stars){s.y+=s.v/60;if(s.y>H){s.y=0;s.x=Math.random()*W;}}}
draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>

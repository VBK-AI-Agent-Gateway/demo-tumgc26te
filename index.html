<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邮件系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;min-height:100vh;color:#2b3440}
header{background:#1f6feb;color:#fff;padding:13px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header h1{font-size:17px;letter-spacing:1px}
.uinfo{font-size:13px;display:flex;gap:14px;align-items:center;opacity:.95}
.uinfo b{color:#ffe58f}
.layout{display:flex;min-height:calc(100vh - 52px)}
.side{width:200px;background:#fff;flex-shrink:0;padding-top:14px;border-right:1px solid #e4e9f0}
.side .mi{padding:13px 22px;color:#5a6a80;font-size:14px;cursor:pointer;border-left:3px solid transparent;user-select:none;transition:.15s}
.side .mi:hover{background:#f0f5ff}
.side .mi.on{background:#e8f1ff;color:#1f6feb;border-left-color:#1f6feb;font-weight:600}
.side .mi .cnt{float:right;background:#e63946;color:#fff;font-size:11px;border-radius:9px;padding:1px 7px;margin-top:2px}
.main{flex:1;padding:20px 24px;min-width:0}
.pTitle{font-size:16px;color:#1f6feb;margin-bottom:14px;padding-left:10px;border-left:4px solid #1f6feb}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select,.f input,.f select,.f textarea{padding:9px 12px;border:1px solid #d4dbe6;border-radius:6px;font-size:14px;outline:none;background:#fff;font-family:inherit}
.toolbar input:focus,.toolbar select:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:#1f6feb}
.btn{padding:9px 18px;border:0;border-radius:6px;cursor:pointer;font-size:14px}
.pri{background:#1f6feb;color:#fff}.pri:hover{background:#1a5fce}
.danger{background:#fdeeee;color:#c0392b}
.ok2{background:#e6f5ec;color:#2f7d4f}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
th{background:#f7f9fc;text-align:left;padding:11px 14px;font-size:13px;color:#64748b;border-bottom:1px solid #e8edf4}
td{padding:12px 14px;font-size:14px;border-bottom:1px solid #f1f4f9;vertical-align:middle}
tr.mailrow{cursor:pointer}
tr.mailrow:hover td{background:#f6faff}
tr.mailrow.unread td{font-weight:700;background:#fbfdff}
tr.mailrow.unread td:first-child::before{content:"●";color:#1f6feb;margin-right:6px;font-size:11px}
tr.mailrow.unread td:first-child{padding-left:8px}
.sub{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{color:#8b98ab;font-size:13px;white-space:nowrap}
.mask{position:fixed;inset:0;background:rgba(30,44,70,.55);display:none;align-items:center;justify-content:center;z-index:20}
.mask.on{display:flex}
.modal{background:#fff;width:640px;max-width:94vw;border-radius:10px;padding:24px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 44px rgba(0,0,0,.3)}
.modal h2{font-size:17px;color:#1f6feb;margin-bottom:16px}
.f{margin-bottom:13px}
.f label{display:block;font-size:13px;color:#7a8699;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%}
.f textarea{min-height:170px;resize:vertical;line-height:1.7}
.f2{display:flex;gap:12px}.f2 .f{flex:1}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.cancel{background:#f1f4f9;color:#5a6a80}
.okb{background:#1f6feb;color:#fff}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1f6feb;color:#fff;padding:10px 26px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:30;font-size:14px}
#toast.show{opacity:1;top:34px}
.empty{background:#fff;text-align:center;color:#9aa7ba;padding:46px 0;border-radius:8px;font-size:14px}
.readview{background:#fff;border-radius:10px;padding:26px 30px;box-shadow:0 1px 4px rgba(0,0,0,.06);line-height:1.9}
.readview h2{font-size:20px;color:#1f6feb;margin-bottom:12px}
.readview .meta{font-size:13px;color:#7a8699;border-bottom:1px dashed #e2e8f0;padding-bottom:12px;margin-bottom:16px}
.readview .body{white-space:pre-wrap;font-size:15px;min-height:180px}
.tag{display:inline-block;padding:2px 10px;border-radius:9px;font-size:12px;color:#fff;background:#94a3b8}
.tag.in{background:#1f6feb}.tag.out{background:#2f7d4f}.tag.dr{background:#f59f00}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-top:4px solid #1f6feb}
.card h3{font-size:15px;color:#1f6feb;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .row{font-size:13px;color:#7a8699;margin:3px 0}
.card .body{font-size:13px;color:#5a6a80;margin-top:7px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.st{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.st .n{font-size:28px;font-weight:700;color:#1f6feb}
.st .t{font-size:13px;color:#7a8699;margin-top:4px}
.back{background:none;border:0;color:#1f6feb;cursor:pointer;font-size:14px;margin-bottom:14px;padding:0}
</style>
</head>
<body>
<header>
  <h1>📧 邮件系统</h1>
  <div class="uinfo">👤 <b>mei@example.com</b> <button class="btn pri" style="padding:6px 16px;font-size:13px" onclick="openCompose()">✎ 写邮件</button></div>
</header>
<div class="layout">
  <div class="side">
    <div class="mi on" data-v="inbox" onclick="go('inbox',this)">📥 收件箱 <span class="cnt" id="ucnt"></span></div>
    <div class="mi" data-v="sent" onclick="go('sent',this)">📤 已发送</div>
    <div class="mi" data-v="draft" onclick="go('draft',this)">📝 草稿箱</div>
    <div class="mi" data-v="trash" onclick="go('trash',this)">🗑 回收站</div>
    <div class="mi" data-v="star" onclick="go('star',this)">⭐ 星标</div>
    <div class="mi" data-v="stat" onclick="go('stat',this)">📊 数据统计</div>
  </div>
  <div class="main">
    <div id="listView">
      <div class="pTitle" id="pTitle">收件箱</div>
      <div class="toolbar">
        <input id="kw" placeholder="搜索发件人/主题/内容…" oninput="renderList()">
        <span style="font-size:13px;color:#7a8699" id="cntInfo"></span>
        <button class="btn pri" style="margin-left:auto" onclick="openCompose()">✎ 写邮件</button>
      </div>
      <div id="tableBox"></div>
    </div>
    <div id="readView" style="display:none">
      <button class="back" onclick="backToList()">← 返回列表</button>
      <div class="readview" id="readBox"></div>
    </div>
    <div id="statView" style="display:none">
      <div class="pTitle">数据统计</div>
      <div class="stats" id="statBox"></div>
    </div>
  </div>
</div>

<div class="mask" id="composeMask"><div class="modal">
  <h2 id="cT">写邮件</h2>
  <div class="f"><label>收件人 *（多个用逗号分隔）</label><input id="c_to" placeholder="friend@example.com"></div>
  <div class="f"><label>主题</label><input id="c_sub" placeholder="邮件主题"></div>
  <div class="f"><label>正文</label><textarea id="c_body" placeholder="请输入邮件内容…"></textarea></div>
  <div class="mbtns">
    <button class="btn cancel" onclick="closeCompose()">关闭</button>
    <button class="btn ok2" onclick="saveDraft()">存草稿</button>
    <button class="btn okb" onclick="sendMail()">📤 发送</button>
  </div>
</div></div>

<div id="toast"></div>

<script>
const ME='mei@example.com';
let MAILS=JSON.parse(localStorage.getItem('ml_mails')||'[]');
let curFolder='inbox',curId=null,editingDraft=null;

function save(){localStorage.setItem('ml_mails',JSON.stringify(MAILS))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',1800)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function nowStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

const FOLDERS={inbox:'收件箱',sent:'已发送',draft:'草稿箱',trash:'回收站',star:'星标'};

function go(v,el){
  curFolder=v;curId=null;
  document.querySelectorAll('.mi').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  document.getElementById('listView').style.display=v==='stat'?'none':'';
  document.getElementById('statView').style.display=v==='stat'?'':'none';
  document.getElementById('readView').style.display='none';
  if(v!=='stat'){document.getElementById('pTitle').textContent=FOLDERS[v];renderList()}
  else renderStat();
}
function backToList(){document.getElementById('readView').style.display='none';document.getElementById('listView').style.display='';renderList()}

function folderMails(f){
  return MAILS.filter(m=>{
    if(f==='star')return m.star&&!m.deleted;
    if(m.deleted)return f==='trash';
    if(f==='trash')return false;
    return m.folder===f;
  }).sort((a,b)=>b.time.localeCompare(a.time));
}

function renderList(){
  const k=(document.getElementById('kw').value||'').trim().toLowerCase();
  let arr=folderMails(curFolder);
  if(k)arr=arr.filter(m=>(m.from+m.to+m.sub+m.body).toLowerCase().includes(k));
  document.getElementById('cntInfo').textContent=arr.length+' 封';
  const box=document.getElementById('tableBox');
  if(!arr.length){box.innerHTML='<div class="empty">暂无邮件</div>';return}
  if(curFolder==='draft'){
    box.innerHTML='<div class="grid2">'+arr.map(m=>
      '<div class="card" style="border-top-color:#f59f00"><h3>📝 '+esc(m.sub||'(无主题)')+'</h3>'+
      '<div class="row">收件人：'+esc(m.to||'—')+'</div>'+
      '<div class="row time">'+esc(m.time)+'</div>'+
      '<div class="body">'+esc(m.body)+'</div>'+
      '<div style="margin-top:11px;display:flex;gap:8px">'+
      '<button class="btn pri" style="padding:6px 14px;font-size:13px" onclick="editDraft(\''+m.id+'\')">继续编辑</button>'+
      '<button class="btn danger" style="padding:6px 14px;font-size:13px" onclick="delMail(\''+m.id+'\')">删除</button></div></div>').join('')+'</div>';
    return;
  }
  box.innerHTML='<table><thead><tr><th style="width:180px">'+(curFolder==='sent'?'收件人':'发件人')+'</th><th>主题</th><th style="width:130px">时间</th><th style="width:150px">操作</th></tr></thead><tbody>'+
    arr.map(m=>{
      const who=curFolder==='sent'?m.to:m.from;
      const unread=m.folder==='inbox'&&!m.read&&!m.deleted;
      return '<tr class="mailrow'+(unread?' unread':'')+'" onclick="openMail(\''+m.id+'\')">'+
      '<td>'+esc(who)+'</td>'+
      '<td><span class="sub">'+(m.star?'⭐ ':'')+esc(m.sub||'(无主题)')+'</span></td>'+
      '<td class="time">'+esc(m.time)+'</td>'+
      '<td onclick="event.stopPropagation()">'+
      '<button class="btn '+(m.star?'ok2':'cancel')+'" style="padding:4px 10px;font-size:12px" onclick="toggleStar(\''+m.id+'\')">'+(m.star?'取消星标':'⭐ 星标')+'</button> '+
      '<button class="btn danger" style="padding:4px 10px;font-size:12px" onclick="delMail(\''+m.id+'\')">删除</button></td></tr>';
    }).join('')+'</tbody></table>';
}

function openMail(id){
  const m=MAILS.find(x=>x.id===id);if(!m)return;
  m.read=true;save();updateBadge();renderList();
  curId=id;
  document.getElementById('listView').style.display='none';
  document.getElementById('readView').style.display='';
  const dir=m.folder==='sent'?('收件人：'+esc(m.to)):('发件人：'+esc(m.from));
  document.getElementById('readBox').innerHTML=
    '<h2>'+esc(m.sub||'(无主题)')+'</h2>'+
    '<div class="meta">'+dir+' &nbsp;|&nbsp; '+esc(m.time)+' &nbsp;|&nbsp; <span class="tag '+(m.folder==='sent'?'out':'in')+'">'+(m.folder==='sent'?'已发送':'收件')+'</span>'+
    (m.folder!=='sent'?' <button class="btn pri" style="padding:4px 12px;font-size:12px;margin-left:10px" onclick="replyTo(\''+m.id+'\')">↩ 回复</button>':'')+
    ' <button class="btn danger" style="padding:4px 12px;font-size:12px" onclick="delMail(\''+m.id+'\');backToList()">删除</button></div>'+
    '<div class="body">'+esc(m.body)+'</div>';
}

function replyTo(id){
  const m=MAILS.find(x=>x.id===id);if(!m)return;
  openCompose();
  document.getElementById('c_to').value=m.from;
  document.getElementById('c_sub').value='Re: '+(m.sub||'');
  document.getElementById('c_body').value='\n\n---- 原邮件 ----\n'+m.body;
}

function toggleStar(id){const m=MAILS.find(x=>x.id===id);m.star=!m.star;save();renderList();updateBadge()}
function delMail(id){
  const m=MAILS.find(x=>x.id===id);
  if(m.deleted||m.folder==='trash'){MAILS=MAILS.filter(x=>x.id!==id);toast('已彻底删除')}
  else{m.deleted=true;toast('已移至回收站')}
  save();renderList();updateBadge();
}
function editDraft(id){
  const m=MAILS.find(x=>x.id===id);if(!m)return;
  openCompose();editingDraft=id;
  document.getElementById('c_to').value=m.to;
  document.getElementById('c_sub').value=m.sub;
  document.getElementById('c_body').value=m.body;
}

function openCompose(){
  editingDraft=null;
  ['c_to','c_sub','c_body'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('cT').textContent='写邮件';
  document.getElementById('composeMask').classList.add('on');
}
function closeCompose(){document.getElementById('composeMask').classList.remove('on')}

function sendMail(){
  const to=document.getElementById('c_to').value.trim();
  if(!to){toast('请填写收件人');return}
  const mail={id:uid(),from:ME,to:to,sub:document.getElementById('c_sub').value.trim()||'(无主题)',
    body:document.getElementById('c_body').value,time:nowStr(),folder:'sent',read:true,star:false,deleted:false};
  if(editingDraft)MAILS=MAILS.filter(x=>x.id!==editingDraft);
  MAILS.unshift(mail);save();closeCompose();renderList();updateBadge();toast('发送成功 ✔');
}
function saveDraft(){
  const mail={id:editingDraft||uid(),from:ME,to:document.getElementById('c_to').value.trim(),
    sub:document.getElementById('c_sub').value.trim()||'(无主题)',
    body:document.getElementById('c_body').value,time:nowStr(),folder:'draft',read:true,star:false,deleted:false};
  if(editingDraft){const i=MAILS.findIndex(x=>x.id===editingDraft);if(i>=0)MAILS[i]=mail}
  else MAILS.unshift(mail);
  editingDraft=null;save();closeCompose();
  if(curFolder==='draft')renderList();
  updateBadge();toast('草稿已保存');
}

function renderStat(){
  const inbox=MAILS.filter(m=>m.folder==='inbox'&&!m.deleted).length;
  const sent=MAILS.filter(m=>m.folder==='sent'&&!m.deleted).length;
  const draft=MAILS.filter(m=>m.folder==='draft'&&!m.deleted).length;
  const unread=MAILS.filter(m=>m.folder==='inbox'&&!m.read&&!m.deleted).length;
  const starred=MAILS.filter(m=>m.star&&!m.deleted).length;
  const trash=MAILS.filter(m=>m.deleted).length;
  document.getElementById('statBox').innerHTML=
    '<div class="st"><div class="n">'+inbox+'</div><div class="t">收件</div></div>'+
    '<div class="st"><div class="n">'+sent+'</div><div class="t">已发送</div></div>'+
    '<div class="st"><div class="n">'+unread+'</div><div class="t">未读</div></div>'+
    '<div class="st"><div class="n">'+draft+'</div><div class="t">草稿</div></div>'+
    '<div class="st"><div class="n">'+starred+'</div><div class="t">星标</div></div>'+
    '<div class="st"><div class="n">'+trash+'</div><div class="t">回收站</div></div>';
}
function updateBadge(){
  const unread=MAILS.filter(m=>m.folder==='inbox'&&!m.read&&!m.deleted).length;
  const el=document.getElementById('ucnt');
  el.textContent=unread?unread:'';
  el.style.display=unread?'':'none';
}

/* ---------- 初始化：示例邮件 ---------- */
if(!MAILS.length){
  const d=(n)=>{const x=new Date(Date.now()-n*3600000);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')+' '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')};
  MAILS=[
    {id:uid(),from:'boss@company.com',to:ME,sub:'本周工作汇报安排',body:'你好，\n\n请各位于周五下午 5 点前提交本周工作汇报，重点说明项目进度与下周计划。\n\n谢谢配合！',time:d(2),folder:'inbox',read:false,star:true,deleted:false},
    {id:uid(),from:'news@techdaily.com',to:ME,sub:'科技早报：AI 新趋势',body:'今日要闻：\n1. 大模型推理成本持续下降\n2. 端侧 AI 设备出货量翻倍\n3. 开源生态加速发展',time:d(6),folder:'inbox',read:false,star:false,deleted:false},
    {id:uid(),from:'hr@company.com',to:ME,sub:'团建活动通知',body:'公司定于本月最后一个周六举办团建，地点：青龙湖公园。请回复是否参加。',time:d(26),folder:'inbox',read:true,star:false,deleted:false},
    {id:uid(),from:'amy@friend.com',to:ME,sub:'周末聚餐',body:'周六晚上一起吃饭吗？新开了一家川菜馆，据说很不错！',time:d(50),folder:'inbox',read:true,star:false,deleted:false},
    {id:uid(),from:ME,to:'boss@company.com',sub:'Re: 本周工作汇报安排',body:'收到，会按时提交。',time:d(1),folder:'sent',read:true,star:false,deleted:false},
    {id:uid(),from:ME,to:'amy@friend.com',sub:'Re: 周末聚餐',body:'好呀，周六见！',time:d(20),folder:'sent',read:true,star:false,deleted:false},
    {id:uid(),from:ME,to:'vendor@supply.com',sub:'询价：办公设备采购',body:'您好，需采购打印机 10 台，请报价，谢谢。',time:d(4),folder:'draft',read:true,star:false,deleted:false},
    {id:uid(),from:'spam@promo.com',to:ME,sub:'限时优惠！',body:'【促销】全场五折，点击抢购……',time:d(70),folder:'inbox',read:true,star:false,deleted:true}
  ];
  save();
}
updateBadge();
renderList();
</script>
</body>
</html>
